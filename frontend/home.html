<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloggr Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="home-container">
        <h1>Welcome to Bloggr</h1>
        <p id="welcomeText">Hello!</p>
        <p>You have successfully logged in.</p>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("bloggrUser"));
        const welcomeText = document.getElementById("welcomeText");

        if (user && user.name) {
            welcomeText.textContent = `Hello, ${user.name}!`;
        } else {
            welcomeText.textContent = "Hello!";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("bloggrUser");
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
