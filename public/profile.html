<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile – Bloggr</title>
  <meta name="description" content="View a Bloggr user's profile and posts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav" id="main-nav" aria-label="Main navigation"></nav>

  <div class="page-narrow">
    <div id="loading" class="loading-row"><span class="spinner"></span> Loading…</div>
    <div id="error-state" class="empty-state hidden"><h2>User not found</h2></div>

    <div id="profile-content" class="hidden">
      <!-- Profile header -->
      <div class="profile-header">
        <div class="avatar" id="avatar-letter">?</div>
        <div class="profile-info">
          <h1 id="profile-name"></h1>
          <p class="profile-bio" id="profile-bio"></p>
          <p class="text-muted text-sm mt-sm" id="profile-joined"></p>
        </div>
      </div>

      <!-- Edit profile (self-only) -->
      <div id="edit-section" class="hidden card" style="padding:1.25rem;margin-bottom:1.5rem">
        <h2 style="margin-bottom:1rem">Edit profile</h2>
        <div class="alert alert-error hidden" id="profile-alert"></div>
        <div class="alert alert-success hidden" id="profile-success"></div>
        <div class="form-group">
          <label for="edit-name">Name</label>
          <input type="text" id="edit-name" maxlength="100">
        </div>
        <div class="form-group">
          <label for="edit-bio">Bio</label>
          <textarea id="edit-bio" rows="3" maxlength="500" placeholder="Tell us about yourself…"></textarea>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" id="save-profile-btn">Save</button>
          <button class="btn btn-danger btn-sm" id="delete-account-btn" style="margin-left:auto">Delete account</button>
        </div>
      </div>

      <!-- Posts -->
      <h2 id="posts-heading" style="margin-bottom:1rem"></h2>
      <div id="posts-list"></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const {
      api: apiClient, getSession: getSessionFn, renderNav: renderNavFn, el: elFn, setHTML: setHTMLFn, setText: setTextFn, show: showFn, hide: hideFn,
      showAlert: showAlertFn, hideAlert: hideAlertFn, escHtml: escHtmlFn, fmtDate: fmtDateFn, blogCardHTML: blogCardHTMLFn
    } = window.Bloggr;

    const params = new URLSearchParams(window.location.search);
    const profileId = params.get("id");
    let session = null;

    if (!profileId) { hideFn("loading"); showFn("error-state"); }

    (async () => {
      await renderNavFn();
      session = await getSessionFn();
      if (profileId) await loadProfile();
    })();

    async function loadProfile() {
      const { ok, data } = await apiClient(`/api/users/${profileId}`);
      hideFn("loading");
      if (!ok) { showFn("error-state"); return; }

      const { user, blogs } = data;
      document.title = `${user.name} – Bloggr`;

      setTextFn("avatar-letter", user.name.charAt(0).toUpperCase());
      setTextFn("profile-name", user.name);
      elFn("profile-bio").textContent = user.bio || "";
      setTextFn("profile-joined", `Member since ${fmtDateFn(user.createdAt)}`);

      const isSelf = session && String(session._id) === String(user._id);
      if (isSelf) {
        showFn("edit-section");
        elFn("edit-name").value = user.name;
        elFn("edit-bio").value  = user.bio || "";
      }

      const label = isSelf ? "Your posts" : `Posts by ${user.name}`;
      setTextFn("posts-heading", `${label} (${blogs.length})`);

      if (blogs.length === 0) {
        setHTMLFn("posts-list", `<div class="empty-state"><p>No posts yet.</p>
          ${isSelf ? `<a href="editor.html" class="btn btn-primary btn-sm mt-sm">Write your first post</a>` : ""}</div>`);
      } else {
        setHTMLFn("posts-list", `<div class="blog-list">${blogs.map(blogCardHTMLFn).join("")}</div>`);
      }

      showFn("profile-content");
    }

    elFn("save-profile-btn")?.addEventListener("click", async () => {
      hideAlertFn("profile-alert");
      hideAlertFn("profile-success");
      const name = elFn("edit-name").value.trim();
      const bio  = elFn("edit-bio").value.trim();
      if (!name) { showAlertFn("profile-alert", "Name cannot be empty"); return; }
      const { ok, data } = await apiClient(`/api/users/${profileId}`, {
        method: "PATCH",
        body: JSON.stringify({ name, bio })
      });
      if (ok) {
        elFn("profile-success").textContent = "Profile updated!";
        elFn("profile-success").classList.remove("hidden");
        setTextFn("profile-name", data.user.name);
        setTextFn("avatar-letter", data.user.name.charAt(0).toUpperCase());
      } else {
        showAlertFn("profile-alert", data?.message || "Could not save");
      }
    });

    elFn("delete-account-btn")?.addEventListener("click", async () => {
      if (!confirm("Delete your account permanently? All your posts and comments will be removed.")) return;
      const { ok } = await apiClient(`/api/users/${profileId}`, { method: "DELETE" });
      if (ok) window.location.href = "/login.html";
    });
  </script>
</body>
</html>
